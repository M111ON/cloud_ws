name = "cloud-memory-worker"
main = "src/index.ts"
compatibility_date = "2026-08-18"

[[d1_databases]]
binding = "cloud_memory_db"
database_name = "cloud-memory-db"
database_id = "6f5eec11-3035-4774-8e08-98abc856ef13"

[[vectorize]]
binding = "VECTORIZE"
index_name = "cloud-memory-vectors"

[ai]
binding = "AI"

[triggers]
crons = ["0 */6 * * *"]  # every 6 hours: auto-pause stale workspaces

# ─── Security (optional) ─────────────────────────────
# ALLOWED_ORIGINS = "https://app.example.com,http://localhost:3000"  # CORS whitelist (comma-separated)
# RATE_LIMIT_PER_MIN = "60"  # Max requests per minute per IP
# To set these, use: wrangler secret put ALLOWED_ORIGINS
